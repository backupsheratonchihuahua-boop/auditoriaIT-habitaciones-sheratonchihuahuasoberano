<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3; url=https://auditoria-habitaciones-nube.vercel.app/">
<title>El sistema se mudó — Auditoría Sheraton Chihuahua</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a0f1a; color:#f1f5f9; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  .card { max-width:440px; background:#1a2235; border:1px solid #2d3a50; border-radius:16px; padding:32px; text-align:center; }
  h1 { font-size:1.3rem; margin:12px 0 8px; }
  p { color:#94a3b8; margin:0 0 20px; }
  a { display:inline-block; padding:12px 24px; background:#10b981; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
</style>
<script>
  // Quitar la app vieja instalada (service worker y caché) y llevar al sistema nuevo
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  setTimeout(() => location.replace('https://auditoria-habitaciones-nube.vercel.app/'), 1500);
</script>
</head>
<body>
  <div class="card">
    <div style="font-size:2.5rem">☁️</div>
    <h1>El Sistema de Auditoría se mudó</h1>
    <p>Esta versión ya no está en uso. Te estamos llevando al sistema nuevo…</p>
    <a href="https://auditoria-habitaciones-nube.vercel.app/">Ir al sistema nuevo</a>
  </div>
</body>
</html>
