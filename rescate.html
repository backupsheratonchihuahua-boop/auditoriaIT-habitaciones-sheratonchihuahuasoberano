<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Rescate de datos — Auditoría Sheraton</title>
<style>
  :root { --bg:#0a0f1a; --card:#1a2235; --input:#0d1424; --accent:#10b981; --warn:#f59e0b; --text:#f1f5f9; --muted:#94a3b8; --border:#2d3a50; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; line-height: 1.5; }
  .card { max-width: 640px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; font-size: .95rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--input); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat b { display:block; font-size: 1.8rem; font-family: ui-monospace, monospace; }
  .stat span { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .ok b { color: var(--accent); } .warn b { color: var(--warn); }
  button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { background: #475569; cursor: default; }
  .lista { background: var(--input); border-radius: 10px; padding: 12px; font-family: ui-monospace, monospace; font-size: .8rem; max-height: 220px; overflow: auto; margin-bottom: 16px; color: var(--muted); }
  .aviso { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35); color: #fbbf24; border-radius: 10px; padding: 12px; font-size: .85rem; margin-bottom: 16px; }
  .hecho { display:none; margin-top: 14px; color: var(--accent); font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>🔋 Rescate de datos de la app vieja</h1>
  <p>Esta página lee lo que la versión anterior guardó <strong>en este navegador</strong> (baterías RFID, checklist, permisos y configuración) y lo descarga en un archivo para pasarlo al sistema nuevo. No envía nada a internet.</p>
  <div id="contenido"></div>
</div>
<script>

"2025-06-12","123":"2025-09-09","223":"2025-03-08","323":"2023-08-14","423":"2025-11-03","523":"2025-09-09","124":"2024-06-03","224":"2024-10-21","324":"2024-02-15","424":"2023-08-28","524":"2023-09-20","125":"2024-12-05","225":"2024-07-29","325":"2023-08-28","425":"2024-04-24","525":"2025-05-16","126":"2025-11-03","226":"2024-09-03","326":"2024-09-05","426":"2025-11-03","526":"2024-07-18","127":"2025-08-08","227":"2024-10-10","327":"2024-04-24","427":"2025-06-28","528":"2024-05-22","128":"2026-01-03","228":"2024-08-30","328":"2023-08-28","428":"2025-09-27","129":"2024-05-04","229":"2024-07-12","329":"2024-12-20","429":"2025-08-01","529":"2024-11-14","130":"2024-05-04","230":"2025-10-18","330":"2024-05-19","430":"2024-07-15","530":"2024-05-13","131":"2025-06-12","231":"2024-11-11","331":"2024-08-05","431":"2024-02-04","531":"2025-06-12","132":"2025-08-01","232":"2024-12-26","332":"2025-10-11","432":"2025-09-27","532":"2025-11-03","133":"2024-03-13","233":"2025-05-03","333":"2024-07-19","433":"2024-06-11","533":"2025-06-12","134":"2024-01-13","234":"2025-09-27","334":"2026-02-21","434":"2024-05-25","534":"2024-06-15","135":"2024-01-13","235":"2025-09-20","335":"2025-01-22","435":"2026-02-21","535":"2024-04-15","136":"2025-12-24","236":"2025-06-12","336":"2025-11-15","436":"2024-05-13","536":"2024-06-17","137":"2026-02-21","237":"2024-12-26","337":"2024-01-29","437":"2025-05-16","537":"2026-01-24","138":"2025-10-25","238":"2026-02-07","338":"2025-09-09","438":"2024-11-14","538":"2024-06-15","139":"2024-11-15","239":"2025-12-06","339":"2024-12-05","439":"2023-09-20","539":"2025-11-22","140":"2025-10-18","240":"2026-01-03","340":"2025-11-22","440":"2024-10-21","540":"2024-06-15","141":"2025-10-11","241":"2023-08-03","341":"2023-09-19","441":"2025-12-13","541":"2024-08-30","142":"2024-05-04","242":"2025-08-22","342":"2025-12-24","442":"2025-12-13","542":"2025-11-22"};
const KEYS = ['battery_rfid_data', 'audit_maint_config', 'audit_custom_permissions', 'system_master_config'];
const datos = {};
KEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v) datos[k] = JSON.parse(v); } catch (e) {} });
const bat = datos.battery_rfid_data || {};
const cambios = Object.keys(bat).filter(h => bat[h] && bat[h] !== DEFAULTS[h]).sort((a, b) => a - b);
const otros = KEYS.slice(1).filter(k => datos[k]);
const el = document.getElementById('contenido');
let html = `<div class="stats">
  <div class="stat ${Object.keys(bat).length ? 'ok' : ''}"><b>${Object.keys(bat).length}</b><span>Habitaciones con baterías guardadas</span></div>
  <div class="stat ${cambios.length ? 'warn' : ''}"><b>${cambios.length}</b><span>Cambios de pila nuevos</span></div>
  <div class="stat"><b>${otros.length}</b><span>Configuraciones personalizadas</span></div>
</div>`;
if (cambios.length) {
  html += `<p>Cambios de pila registrados en este navegador que <strong>no</strong> están en la nube:</p><div class="lista">${cambios.map(h => `Hab. ${h}: ${DEFAULTS[h] || 'sin fecha'} → <b style="color:#fbbf24">${bat[h]}</b>`).join('<br>')}</div>`;
}
if (!Object.keys(datos).length) {
  html += `<div class="aviso">⚠️ Este navegador no tiene datos de la app vieja. Si la usabas en otra computadora o en otro navegador (Chrome, Edge, celular), abre este mismo enlace allá.</div>`;
} else if (!cambios.length && !otros.length) {
  html += `<div class="aviso">✅ No hay nada nuevo que rescatar en este navegador: las fechas coinciden con las que ya están en la nube.</div>`;
}
html += `<button id="btn" ${Object.keys(datos).length ? '' : 'disabled'}>⬇️ Descargar respaldo</button><div class="hecho" id="hecho">✅ Descargado. Guárdalo en la carpeta del proyecto y avísale a Claude.</div>`;
el.innerHTML = html;
document.getElementById('btn').onclick = () => {
  const payload = { origen: location.href, fecha: new Date().toISOString(), navegador: navigator.userAgent, cambios_baterias: cambios.length, datos };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  a.download = 'rescate_app_vieja_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  document.getElementById('hecho').style.display = 'block';
};
</script>
</body>
</html>
